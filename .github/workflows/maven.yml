name: Maven CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and validate Cucumber bindings
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and dry-run Cucumber suite
        run: mvn --batch-mode --no-transfer-progress verify -Dcucumber.execution.dry-run=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/cucumber-reports.html
            target/cucumber.json
            target/cucumber.xml
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
