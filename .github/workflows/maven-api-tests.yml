name: Maven API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Run booking API scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run booking scenarios
        run: >-
          mvn --batch-mode --no-transfer-progress verify
          '-Dcucumber.filter.tags=@booking'

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            target/cucumber-reports.html
            target/cucumber.json
            target/cucumber.xml
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
