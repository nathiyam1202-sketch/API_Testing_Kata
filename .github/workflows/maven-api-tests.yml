name: Maven API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Run booking API scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Booking scenarios
        env:
          BASE_URL: https://automationintesting.online/api
          AUTH_USERNAME: ${{ secrets.BOOKING_API_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.BOOKING_API_PASSWORD }}
        run: |
          if [ -n "$AUTH_USERNAME" ] && [ -n "$AUTH_PASSWORD" ]; then
            echo "Booking API credentials are configured; running live scenarios."
            mvn --batch-mode --no-transfer-progress verify '-Dcucumber.filter.tags=@booking'
          else
            echo "::notice title=Live API tests skipped::Configure BOOKING_API_USERNAME and BOOKING_API_PASSWORD to run live Booking API scenarios. Running a dry-run to validate feature bindings."
            mvn --batch-mode --no-transfer-progress verify '-Dcucumber.filter.tags=@booking' -Dcucumber.execution.dry-run=true
          fi

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            target/cucumber-reports.html
            target/cucumber.json
            target/cucumber.xml
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
